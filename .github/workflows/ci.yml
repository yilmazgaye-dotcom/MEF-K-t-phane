name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sözdizimi denetimi (tarayıcı betikleri)
        run: npm run check:syntax
      - name: Birim testleri
        run: npm test
      - name: Bilgi tabanı denetimi
        run: npm run check:knowledge
